<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pieceberry</title>
<meta name="theme-color" content="#6b3f7a">
<style>
  :root { --ink:#3a2a40; --ink2:#7a6582; --card:rgba(255,255,255,.88); --berry:#8e4f9e; --berry2:#6b3f7a; --gold:#f2b632;
    --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, sans-serif; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; }
  body { font-family:var(--font); color:var(--ink); background:#efe4f0; overflow:hidden; }
  .screen { position:fixed; inset:0; display:flex; flex-direction:column; }
  .hidden { display:none !important; }

  /* home */
  #home { overflow-y:auto; padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 24px);
    background: radial-gradient(circle at 12% 0%, #fff7fb 0, rgba(255,247,251,0) 42%), radial-gradient(circle at 92% 28%, #e3d3f0 0, rgba(227,211,240,0) 46%), linear-gradient(170deg,#f6ecf3 0%,#e9dcef 55%,#dfe3f2 100%); }
  .wrap { max-width:640px; margin:0 auto; width:100%; }
  header { display:flex; align-items:center; gap:10px; padding:4px 2px 12px; }
  .logo { width:46px; height:46px; border-radius:15px; background:linear-gradient(145deg,#b177c2,#6b3f7a); box-shadow:0 6px 14px rgba(107,63,122,.4), inset 0 2px 0 rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:27px; flex:none; }
  h1 { margin:0; font-size:22px; font-weight:900; letter-spacing:-.4px; color:var(--berry2); }
  .sub { font-size:13px; color:var(--ink2); font-weight:700; margin-top:2px; }
  .iconbtn { margin-left:auto; width:46px; height:46px; border-radius:50%; border:1px solid #fff; background:var(--card); box-shadow:0 3px 10px rgba(80,40,90,.15); font-size:19px; cursor:pointer; }
  h2.sec { font-size:15px; margin:14px 4px 8px; color:var(--ink2); font-weight:900; letter-spacing:.3px; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:560px) { .grid { grid-template-columns:repeat(3,1fr); } }
  .pic { border:0; padding:0; background:#fff; border-radius:18px; overflow:hidden; text-align:left; cursor:pointer; font:inherit; color:inherit;
    box-shadow:0 6px 0 rgba(80,40,90,.12), 0 10px 22px rgba(80,40,90,.12); position:relative; transition:transform .12s; }
  .pic:active { transform:translateY(3px); }
  .pic img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; background:#ddd; }
  .pic .t { padding:8px 10px 10px; }
  .pic .t b { display:block; font-size:13.5px; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pic .t small { display:block; font-size:12px; color:var(--ink2); font-weight:700; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .badge { position:absolute; top:8px; right:8px; background:rgba(255,255,255,.94); border-radius:999px; padding:4px 9px; font-weight:900; font-size:12px; color:var(--berry2); box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .badge.done { background:linear-gradient(135deg,#ffd45e,#f2b632); color:#5e4a0a; }
  .foot { text-align:center; color:var(--ink2); font-size:12.5px; font-weight:700; margin:22px 0 4px; line-height:1.5; }
  .foot button { padding:14px 12px; min-height:44px; border:0; background:none; color:var(--berry); font:inherit; font-weight:900; text-decoration:underline; cursor:pointer; }

  /* daily puzzle card */
  .daily { display:flex; gap:12px; width:100%; border:2px solid #fff; border-radius:22px; padding:12px; margin:0 0 12px; text-align:left; cursor:pointer; font:inherit; color:inherit;
    background:linear-gradient(150deg,#fff 0%,#f8eef9 60%,#fdf3dc 100%); box-shadow:0 7px 0 rgba(80,40,90,.12), 0 12px 26px rgba(80,40,90,.14); transition:transform .12s; }
  .daily:active { transform:translateY(3px); }
  .daily .dimg { width:40%; max-width:170px; flex:none; position:relative; }
  .daily .dimg img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:15px; display:block; box-shadow:0 4px 12px rgba(0,0,0,.18); }
  .daily .dimg .tick { position:absolute; inset:0; border-radius:15px; background:rgba(255,255,255,.35); display:flex; align-items:center; justify-content:center; font-size:46px; }
  .daily .dl { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .daily .kick { font-size:11.5px; font-weight:900; color:var(--berry); text-transform:uppercase; letter-spacing:.6px; }
  .daily .dt { font-size:18px; font-weight:900; line-height:1.15; }
  .daily .st { font-size:13px; color:var(--ink2); font-weight:700; }
  .daily .streak { font-size:13.5px; font-weight:900; color:#a4570f; }
  .week { display:flex; gap:4px; margin:3px 0 6px; }
  .week span { width:21px; height:21px; border-radius:50%; background:#efe2f1; font-size:10px; font-weight:900; display:flex; align-items:center; justify-content:center; color:var(--ink2); }
  .week span.on { background:linear-gradient(135deg,#ffd45e,#f2b632); color:#5e4a0a; box-shadow:0 2px 0 #c98f12; }
  .week span.now { box-shadow:0 0 0 2px var(--berry); }
  .daily .go { margin-top:auto; align-self:flex-start; background:linear-gradient(135deg,#b177c2,#8e4f9e); color:#fff; border-radius:13px; padding:9px 16px; font-weight:900; font-size:14.5px; box-shadow:0 4px 0 #5e3270; }
  .daily.done .go { background:#e6f5ea; color:#2f7a48; box-shadow:0 3px 0 #bfe3c8; }

  /* tabs */
  .tabs { display:flex; gap:4px; padding:4px; border-radius:16px; background:rgba(255,255,255,.62); border:1px solid #fff; margin:4px 0 12px; }
  .tabs button { flex:1; border:0; background:transparent; padding:14px 6px; min-height:46px; border-radius:12px; font:inherit; font-weight:900; font-size:15px; color:var(--ink2); cursor:pointer; }
  .tabs button.on { background:linear-gradient(135deg,#b177c2,#8e4f9e); color:#fff; box-shadow:0 4px 10px rgba(142,79,158,.4); }

  /* collection wall */
  .collhead { text-align:center; font-weight:800; color:var(--ink2); font-size:13.5px; margin:0 0 12px; }
  .collhead b { color:var(--berry2); font-size:22px; display:block; }
  .collhead .bar2 { height:8px; border-radius:999px; background:#eadcec; margin:8px auto 0; max-width:260px; overflow:hidden; }
  .collhead .bar2 i { display:block; height:100%; background:linear-gradient(90deg,#b177c2,#f2b632); border-radius:999px; }
  .wall { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:22px 16px; padding:18px 12px 22px; border-radius:20px;
    background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 22px,rgba(0,0,0,.035) 22px 44px), linear-gradient(180deg,#e9dccb,#ddcdb6); box-shadow:inset 0 2px 10px rgba(80,50,20,.15); }
  @media (min-width:560px) { .wall { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .frame { width:100%; align-self:start; border:0; padding:7px; border-radius:4px; cursor:pointer; position:relative; font:inherit; text-align:center;
    background:linear-gradient(145deg,#b98a4e,#7a4f24); box-shadow:0 10px 16px rgba(60,30,10,.32), inset 0 0 0 1px rgba(255,255,255,.3), inset 0 0 0 4px rgba(0,0,0,.12); transform:rotate(var(--tilt,0deg)); transition:transform .15s; }
  .frame:active { transform:rotate(0deg) scale(.98); }
  .frame.gold { background:linear-gradient(145deg,#f7da83,#b8862a); }
  .frame img { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; border:4px solid #fbf6ec; box-shadow:inset 0 0 0 1px rgba(0,0,0,.1); }
  .frame .pin { position:absolute; top:-7px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#ff9aa8,#c0394f); box-shadow:0 2px 3px rgba(0,0,0,.35); }
  .frame .cap { margin-top:6px; font-size:11.5px; font-weight:800; color:#fff8ea; text-shadow:0 1px 0 rgba(0,0,0,.35); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .frame .times { position:absolute; bottom:-9px; right:-7px; background:linear-gradient(135deg,#ffd45e,#f2b632); color:#5e4a0a; border-radius:999px; font-size:11px; font-weight:900; padding:2px 7px; box-shadow:0 2px 4px rgba(0,0,0,.25); }
  .empty { grid-column:1/-1; text-align:center; color:#7a6150; font-weight:800; padding:26px 10px; line-height:1.5; }
  .empty .big { font-size:40px; display:block; margin-bottom:6px; }

  /* full-screen picture viewer */
  #viewer { position:fixed; inset:0; z-index:25; display:flex; flex-direction:column; background:radial-gradient(circle at 50% 40%,#3a2b44,#140c19 75%); color:#fff; }
  .vtop { display:flex; align-items:center; gap:10px; padding:calc(env(safe-area-inset-top) + 10px) 12px 6px; }
  .vcap { flex:1; min-width:0; }
  .vcap b { display:block; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vcap small { display:block; font-size:12.5px; opacity:.75; font-weight:700; }
  .vimg { flex:1; min-height:0; position:relative; display:flex; align-items:center; justify-content:center; padding:10px; }
  .vimg img { max-width:100%; max-height:100%; border:6px solid #fbf6ec; border-radius:3px; box-shadow:0 24px 60px rgba(0,0,0,.6); }
  .vbtn { width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.16); color:#fff; font:inherit; font-size:20px; font-weight:900; cursor:pointer; flex:none; }
  .varr { position:absolute; top:50%; margin-top:-22px; font-size:28px; z-index:2; background:rgba(20,10,25,.62); box-shadow:0 0 0 2px rgba(255,255,255,.55), 0 4px 12px rgba(0,0,0,.4); }
  #vPrev { left:8px; } #vNext { right:8px; }
  .vfoot { padding:8px 16px calc(env(safe-area-inset-bottom) + 16px); max-width:420px; width:100%; margin:0 auto; }

  /* table backgrounds (the playing table; also used for the small previews in the shop) */
  #play.bg-felt, .bgprev.bg-felt { background:radial-gradient(circle at 50% 35%,#3f8a5b 0,#2a6a45 60%,#1c4630 100%); }
  #play.bg-oak, .bgprev.bg-oak { background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 3px,rgba(0,0,0,.06) 3px 9px),linear-gradient(180deg,#9a6a3a,#74492a); }
  #play.bg-linen, .bgprev.bg-linen { background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px),linear-gradient(180deg,#8d8372,#6f6657); }
  #play.bg-slate, .bgprev.bg-slate { background:radial-gradient(circle at 50% 30%,#56616d,#2c343d 85%); }
  #play.bg-cabin, .bgprev.bg-cabin { background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 2px,transparent 2px 46px),linear-gradient(180deg,#6b4428,#38220f); }
  #play.bg-starry, .bgprev.bg-starry { background:radial-gradient(1.5px 1.5px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 70px,#fff,transparent),radial-gradient(1.3px 1.3px at 130px 120px,#cfd8ff,transparent),radial-gradient(1px 1px at 60px 150px,#fff,transparent),linear-gradient(180deg,#0d1430,#1c2a58);
    background-size:160px 180px,160px 180px,160px 180px,160px 180px,100% 100%; }
  .bgprev { background:radial-gradient(circle at 50% 40%, #5d4a68 0, #3b2d45 70%, #2c2134 100%); }

  /* pictures: pack filter chips + locks */
  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 12px; margin:0 -2px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chipb { flex:none; border:0; border-radius:999px; padding:13px 16px; min-height:44px; background:#fff; box-shadow:0 3px 8px rgba(80,40,90,.12); font:inherit; font-weight:800; font-size:13.5px; color:var(--ink); cursor:pointer; }
  .chipb.on { background:linear-gradient(135deg,#b177c2,#8e4f9e); color:#fff; }
  .pic.locked img { filter:saturate(.55) brightness(.9); }
  .badge.lock { background:rgba(40,20,50,.82); color:#fff; }

  /* shop */
  .club { border-radius:24px; padding:16px; margin:0 0 16px; background:linear-gradient(150deg,#fff8e0,#ffe9a8); border:2px solid #f2d46b; box-shadow:0 10px 22px rgba(120,90,10,.18); }
  .club h3 { margin:0 0 4px; font-size:22px; font-weight:900; color:#7a5a05; }
  .club p { margin:0 0 12px; font-size:14px; font-weight:700; color:#6d5a2a; line-height:1.4; }
  .club .plans { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
  .club .plan { border:0; border-radius:16px; padding:12px 4px; background:#fff; font:inherit; font-weight:900; font-size:15px; color:#5e4a0a; cursor:pointer; box-shadow:0 4px 0 rgba(120,90,10,.2); }
  .club .plan small { display:block; font-weight:800; opacity:.75; font-size:12px; margin-top:2px; }
  .club .plan.best { background:linear-gradient(135deg,#ffd45e,#f2b632); box-shadow:0 4px 0 #b88a12; }
  .club .have { font-weight:900; color:#2f7a48; font-size:15px; }
  .shopsec { margin:18px 0 0; }
  .shopsec > h3 { margin:0 4px 4px; font-size:17px; font-weight:900; color:var(--berry2); }
  .shopsec > .hint { margin:0 4px 10px; font-size:13px; color:var(--ink2); font-weight:700; }
  .sgrid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
  @media (min-width:560px) { .sgrid { grid-template-columns:repeat(3,minmax(0,1fr)); } }
  .scard { border:0; padding:8px; border-radius:18px; background:#fff; text-align:left; font:inherit; color:inherit; cursor:pointer; box-shadow:0 5px 0 rgba(80,40,90,.12), 0 8px 16px rgba(80,40,90,.1); position:relative; }
  .scard:active { transform:translateY(2px); }
  .sprev { height:78px; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#f3e9f5; font-size:34px; }
  .sprev .strip { display:flex; width:100%; height:100%; }
  .sprev .strip img { flex:1; min-width:0; height:100%; object-fit:cover; }
  .sprev.bgprev { border-radius:12px; }
  .sprev svg { width:64px; height:64px; display:block; }
  .scard .nm { font-weight:900; font-size:14px; margin:7px 2px 1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .scard .pr { font-size:12.5px; font-weight:800; color:var(--ink2); margin:0 2px 2px; }
  .scard .pr.owned { color:#2f7a48; }
  .scard .use { position:absolute; top:12px; left:12px; background:rgba(47,122,72,.92); color:#fff; border-radius:999px; font-size:11px; font-weight:900; padding:3px 8px; }
  .scard .lk { position:absolute; top:12px; right:12px; background:rgba(40,20,50,.8); color:#fff; border-radius:999px; font-size:11px; font-weight:900; padding:3px 8px; }
  .restore { display:block; margin:12px auto 4px; padding:14px 18px; min-height:44px; border:0; background:none; font:inherit; font-weight:900; color:var(--berry); text-decoration:underline; cursor:pointer; font-size:14px; }
  .isheet h3 { margin:12px 2px 2px; font-size:20px; font-weight:900; }
  .isheet .pv { border-radius:16px; overflow:hidden; background:#f3e9f5; min-height:110px; display:flex; align-items:center; justify-content:center; }
  .isheet .pv .bgprev { width:100%; height:140px; }
  .isheet .pv svg { width:110px; height:110px; margin:10px; }
  .isheet .pgrid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:6px; width:100%; padding:6px; }
  .isheet .pgrid img { width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:8px; display:block; }
  .isheet .bl { color:var(--ink2); font-weight:700; font-size:14px; margin:2px 2px 8px; line-height:1.4; }
  .isheet .note { color:var(--ink2); font-size:12.5px; font-weight:700; text-align:center; margin:10px 0 0; line-height:1.4; }
  #musicBtn.on { background:linear-gradient(135deg,#b177c2,#8e4f9e); }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 90px); transform:translateX(-50%); z-index:40; background:rgba(40,20,50,.92); color:#fff; padding:11px 18px; border-radius:999px; font-weight:800; font-size:14px; max-width:86vw; text-align:center; box-shadow:0 8px 22px rgba(0,0,0,.35); }

  /* play */
  #play { background: radial-gradient(circle at 50% 30%, #5d4a68 0, #3b2d45 70%, #2c2134 100%); }
  .bar { display:flex; align-items:center; gap:8px; padding:calc(env(safe-area-inset-top) + 8px) 10px 8px; color:#fff; }
  .bar .back { width:46px; height:46px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:#fff; font-size:22px; font-weight:900; cursor:pointer; flex:none; }
  .bar .tt { flex:1; min-width:0; }
  .bar .tt b { display:block; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .bar .tt small { display:block; font-size:12px; opacity:.75; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .count { background:rgba(255,255,255,.16); border-radius:999px; padding:7px 12px; font-weight:900; font-size:14px; flex:none; }
  #stage { flex:1; position:relative; min-height:0; }
  #cv { position:absolute; left:0; top:0; display:block; }
  .zoom { position:absolute; right:10px; top:10px; display:flex; flex-direction:column; gap:8px; z-index:5; }
  .zoom button { width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.18); color:#fff; font:inherit; font-size:24px; font-weight:900; line-height:1; cursor:pointer; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); box-shadow:0 3px 10px rgba(0,0,0,.25); }
  .zoom button:active { background:rgba(255,255,255,.34); }
  .zoom .fit { font-size:13px; }
  .tools { display:flex; gap:8px; justify-content:center; padding:8px 10px calc(env(safe-area-inset-bottom) + 10px); background:rgba(20,12,24,.55); }
  .tool { flex:1 1 0; max-width:110px; border:0; border-radius:16px; padding:9px 4px 8px; background:rgba(255,255,255,.12); color:#fff; font:inherit; font-weight:800; font-size:12.5px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px; user-select:none; -webkit-user-select:none; touch-action:none; }
  .tool .i { font-size:21px; line-height:1; }
  .tool.on { background:linear-gradient(135deg,#b177c2,#8e4f9e); box-shadow:0 3px 10px rgba(142,79,158,.55); }

  /* sheets */
  .overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:flex-end; justify-content:center; background:rgba(40,20,50,.5); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
  .overlay.center { align-items:center; padding:20px; }
  .sheet { width:min(100%,520px); background:linear-gradient(175deg,#fff,#f7eff8); border-radius:28px 28px 0 0; padding:18px 18px calc(env(safe-area-inset-bottom) + 20px); box-shadow:0 -20px 50px rgba(0,0,0,.3); max-height:90vh; overflow-y:auto; }
  .sheet img.prev { width:100%; max-height:34vh; object-fit:contain; border-radius:14px; background:#eee; display:block; }
  .sheet h3 { margin:12px 2px 2px; font-size:19px; font-weight:900; }
  .sheet .by { color:var(--ink2); font-weight:700; font-size:13.5px; margin:0 2px 12px; }
  .sizes { display:grid; grid-template-columns:repeat(5,1fr); gap:8px; }
  .size { border:0; border-radius:16px; padding:12px 2px 10px; background:#fff; box-shadow:0 4px 0 rgba(80,40,90,.14), 0 6px 14px rgba(80,40,90,.1); font:inherit; font-weight:900; font-size:19px; color:var(--ink); cursor:pointer; }
  .size small { display:block; font-size:11px; color:var(--ink2); font-weight:800; margin-top:2px; }
  .btn { width:100%; border:0; border-radius:16px; padding:15px 10px; font:inherit; font-weight:900; font-size:16.5px; cursor:pointer; box-shadow:0 5px 0 rgba(0,0,0,.14); margin-top:10px; }
  .btn.pri { background:linear-gradient(135deg,#b177c2,#8e4f9e); color:#fff; box-shadow:0 5px 0 #5e3270; }
  .btn.sec { background:#fff; color:var(--ink); border:2px solid #e6d6ea; }
  .row { display:flex; gap:10px; } .row .btn { flex:1; }
  .lbl { font-size:13px; font-weight:900; color:var(--ink2); margin:14px 2px 8px; text-transform:uppercase; letter-spacing:.3px; }
  .win { width:min(92vw,400px); background:linear-gradient(170deg,#fff,#f7eff8); border-radius:28px; padding:20px 18px 18px; text-align:center; box-shadow:0 30px 70px rgba(0,0,0,.4); border:3px solid #fff; }
  .win img { width:100%; border-radius:14px; display:block; box-shadow:0 8px 20px rgba(0,0,0,.25); }
  .win h2 { margin:14px 0 2px; font-size:28px; font-weight:900; color:var(--berry2); }
  .win p { margin:0 0 6px; color:var(--ink2); font-weight:700; font-size:14px; }
  .credits { font-size:13px; line-height:1.45; }
  .credits div { padding:7px 0; border-bottom:1px solid #eadcec; }
  .credits a { color:var(--berry); }
  .set { display:flex; align-items:center; justify-content:space-between; padding:12px 2px; border-bottom:1px solid #eadcec; font-weight:800; }

<script src="store-bridge.js?v=18"></script>
<script>window.STORE_LIVE = false; /* the store build turns this on: no test dates, no free test unlock, no debug hooks */</script>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  // Phones: 12 to 192 pieces. Tablets and wide screens: 24 to 300.
  const sizesNow = () => (Math.min(innerWidth, innerHeight) >= 700 ? [24, 48, 108, 192, 300] : [12, 24, 48, 108, 192]);
  const pref = (k, d) => { try { const v = localStorage.getItem('jg_pref_' + k); return v === null ? d : v === '1'; } catch (e) { return d; } };
  const setPref = (k, v) => { try { localStorage.setItem('jg_pref_' + k, v ? '1' : '0'); } catch (e) { } };
  Jig.sound = pref('sound', true); Jig.ghost = pref('ghost', true); Jig.big = pref('big', true);
  const key = (i) => 'jg_p' + i;
  let cur = -1, curDaily = null, img = null, homeTab = 'pics', trialKeep = false;
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } },
  };

  // ---------- dates (local time; window.__jgToday = 'YYYY-MM-DD' overrides it for testing) ----------
  const dstr = (d) => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  const today = () => (!window.STORE_LIVE && window.__jgToday) || dstr(new Date());
  const addDays = (s, k) => { const d = new Date(s + 'T12:00:00'); d.setDate(d.getDate() + k); return dstr(d); };
  const dayNum = (s) => Math.round((new Date(s + 'T12:00:00') - new Date('2026-01-01T12:00:00')) / 864e5);
  const niceDate = (s) => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
  const shortDate = (s) => new Date(s + 'T12:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });

  // ---------- Daily Puzzle: same picture and same cut for everyone that day; every picture comes up once before any repeats ----------
  // public pages (published by the Kelbra site after David approves; the folder name is permanent once the app is in the stores)
  const LEGAL = 'https://games.kelbrasolutions.net/pieceberry';
  const DAILY_N = 48, DKEY = (s) => 'jg_daily_' + s;
  let PERM = null;
  function dailyIndex(s) {
    if (!PERM) {
      let a = 20261020; const rnd = () => { a = (a * 1103515245 + 12345) & 0x7fffffff; return a / 0x7fffffff; };
      PERM = PICS.map((_, i) => i);
      for (let i = PERM.length - 1; i > 0; i--) { const k = Math.floor(rnd() * (i + 1)); [PERM[i], PERM[k]] = [PERM[k], PERM[i]]; }
    }
    const n = dayNum(s), L = PERM.length; return PERM[((n % L) + L) % L];
  }
  const dailySeed = (s) => dayNum(s) * 7919 + 17;

  // ---------- streak: finishing today's puzzle on the day after the last one adds 1; a missed day starts again at 1. Best is kept. ----------
  const blankStreak = () => ({ last: null, count: 0, best: 0, days: [] });
  function streakInfo() {
    const s = store.get('jg_streak', blankStreak()), t = today();
    const alive = s.last === t || s.last === addDays(t, -1);
    return Object.assign({}, s, { current: alive ? s.count : 0, doneToday: s.last === t });
  }
  function markDailyDone(day) {
    const s = store.get('jg_streak', blankStreak());
    if (day !== today() || s.last === day) return s;   // an old daily finished late does not change the streak
    s.count = s.last === addDays(day, -1) ? s.count + 1 : 1;
    s.last = day; s.best = Math.max(s.best || 0, s.count); s.days = (s.days || []).concat(day).slice(-400);
    store.set('jg_streak', s); return s;
  }

  // ---------- collection: every finished picture, keyed by where it came from (stays right if the picture list is reordered) ----------
  const picKey = (i) => PICS[i].from || PICS[i].file;
  function addToCollection(i, pieces, isDaily) {
    const c = store.get('jg_collection', {}), k = picKey(i), e = c[k] || { first: today(), times: 0, pieces: 0, daily: 0 };
    e.last = today(); e.times++; e.pieces = Math.max(e.pieces, pieces); if (isDaily) e.daily++;
    c[k] = e; store.set('jg_collection', c);
  }
  function collectionList() {
    const c = store.get('jg_collection', {}), out = [];
    PICS.forEach((p, i) => { const e = c[picKey(i)]; if (e) out.push(Object.assign({ i }, e)); });
    return out.sort((a, b) => (a.last < b.last ? 1 : a.last > b.last ? -1 : b.i - a.i));
  }
  // one-time: pictures finished before the collection existed
  if (!store.get('jg_coll_mig', false)) {
    PICS.forEach((p, i) => { const s = Jig.loadSave(key(i)); if (s && s.done) addToCollection(i, s.cols * s.rows, false); });
    store.set('jg_coll_mig', true);
  }

  // =====================================================================================
  // SHOP: catalog, purchases, equipping. No ads anywhere. Everything here is cosmetic; the Daily Puzzle is always free.
  // =====================================================================================
  const PACKS = [
    ['starter', 'Starter Collection', 0, 'Cozy corners and cottage gardens. Free for everyone.'],
    ['seasons', 'Seasons & Orchards', 1.99, 'Autumn lanes, spring blossom, snowy villages and summer meadows.'],
    ['harbors', 'Harbors & Hillsides', 1.99, 'Fishing boats, lighthouses and sunny hillside towns.'],
    ['pantry', 'Sweet Shop & Pantry', 1.99, 'Candy jars, spice markets and farmhouse tables.'],
    ['villages', 'Villages & Castles', 1.99, 'Stone bridges, mossy towers and walled hill villages.'],
    ['mosaics', 'Mosaics & Patterns', 1.99, 'Shells, buttons, leaves and stained glass. Busy and satisfying.'],
    ['friends', 'Furry Friends', 1.99, 'Kittens, puppies, foxes and colourful birds.'],
  ];
  const BGS = [['plum', 'Plum evening', 0, 'The classic dark table.'], ['felt', 'Green felt', 0.99, 'Like a card table.'], ['linen', 'Soft linen', 0.99, 'Woven cloth in warm grey.'],
    ['slate', 'Slate', 0.99, 'Cool stone grey.'], ['oak', 'Oak table', 1.99, 'Warm wood grain.'], ['cabin', 'Cozy cabin', 1.99, 'Dark wooden planks.'], ['starry', 'Starry night', 1.99, 'A deep blue sky with stars.']];
  const STYLES = [['classic', 'Classic', 0, 'The standard puzzle piece.'], ['soft', 'Soft & rounded', 0.99, 'Gentle edges with a soft shadow.'], ['glossy', 'Glossy card', 1.99, 'Shiny, like a printed cardboard piece.'],
    ['wooden', 'Wooden', 1.99, 'A warm wooden edge, like a puzzle from a toy shop.'], ['stained', 'Stained glass', 1.99, 'Bold dark lines between the pieces.']];
  const SNDS = [['wood', 'Soft wood', 0, 'A gentle wooden click.'], ['chimes', 'Gentle chimes', 0.99, 'A tiny bell each time a piece fits.'], ['drops', 'Raindrops', 0.99, 'A soft drip.'],
    ['bubble', 'Bubbles', 0.99, 'A little pop.'], ['paper', 'Paper', 0.99, 'A quiet paper tap.']];
  const MUSICS = ['meadow', 'zen', 'tea', 'lantern', 'fireside', 'piano', 'beach', 'lullaby', 'sunrise'];
  const ITEMS = {};
  const addItems = (cat, list, f) => list.forEach((r) => { const k = f ? f(r) : r; ITEMS[cat + '_' + k[0]] = { id: cat + '_' + k[0], cat, key: k[0], name: k[1], usd: k[2], blurb: k[3] }; });
  addItems('pack', PACKS); addItems('bg', BGS); addItems('style', STYLES); addItems('snd', SNDS);
  MUSICS.forEach((k) => { const m = window.MMusic && MMusic.PACKS[k]; if (m) ITEMS['music_' + k] = { id: 'music_' + k, cat: 'music', key: k, name: m.name, usd: m.price || 0, blurb: m.blurb }; });
  Jig.catalog = function () { return { items: ITEMS, club: CLUB }; };
  const CLUB = { club_monthly: ['Club monthly', 2.99], club_yearly: ['Club yearly', 19.99] };
  const CATS = { pack: 'Picture packs', bg: 'Table backgrounds', style: 'Piece styles', snd: 'Click sounds', music: 'Music' };
  const DEFAULT = { bg: 'plum', style: 'classic', snd: 'wood', music: 'meadow' };
  const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  const SHOP = { prices: {}, busy: false };
  const trial = {};   // things being tried out (not bought); cleared when you leave the shop or a puzzle
  let P = { own: store.get('jg_own', {}), eq: Object.assign({}, DEFAULT, store.get('jg_eq', {})), music: pref('music', false) };
  const saveP = () => { store.set('jg_own', P.own); store.set('jg_eq', P.eq); };

  const isFree = (id) => !ITEMS[id] || !ITEMS[id].usd;
  const hasClub = () => !!(P.own && P.own.club);
  const owns = (id) => isFree(id) || hasClub() || !!(P.own && P.own[id]);
  const priceOf = (id) => SHOP.prices[id] || '$' + (ITEMS[id] ? ITEMS[id].usd : CLUB[id][1]).toFixed(2);
  const hasPic = (i) => owns('pack_' + PICS[i].pack);
  const equipped = (cat) => { if (trial[cat]) return trial[cat]; const k = P.eq[cat]; return owns(cat + '_' + k) ? k : DEFAULT[cat]; };
  function pidOf(id) { return id; }

  // What you own is always re-read from the store when the app starts; what is saved on the phone is only a copy.
  // In the app, the store bridge (RevenueCat) sets window.PBStore = { buy(id), restore(), owned(), prices() }, each a Promise.
  // buy/restore/owned give the list of ids the player owns (without the store prefix; any Club subscription gives 'club').
  function setOwned(ids, replace) { if (replace || !P.own) P.own = {}; (ids || []).forEach((i) => { if (i === 'club' || i === 'club_monthly' || i === 'club_yearly') P.own.club = 1; else if (ITEMS[i]) P.own[i] = 1; }); saveP(); }
  function storeSync() {
    if (!window.PBStore) return;
    window.PBStore.owned().then((ids) => { setOwned(ids, true); applyLook(); renderAll(); }).catch(() => { });
    if (window.PBStore.prices) window.PBStore.prices().then((pr) => { SHOP.prices = pr || {}; }).catch(() => { });
  }
  function toast(t) {
    let e = document.querySelector('.toast'); if (e) e.remove();
    e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600);
  }
  function buy(id) {
    if (SHOP.busy) return;
    const nm = ITEMS[id] ? ITEMS[id].name : CLUB[id][0];
    if (window.PBStore) {
      SHOP.busy = true; toast('Opening the store…');
      window.PBStore.buy(id).then((ids) => { SHOP.busy = false; setOwned(ids, true); if (owns(id) || (CLUB[id] && hasClub())) bought(id); else toast('Purchase not finished. You were not charged.'); })
        .catch(() => { SHOP.busy = false; toast('Purchase not finished. You were not charged.'); });
      return;
    }
    if (NATIVE || window.STORE_LIVE) { toast('The store is not available right now. Please try again later.'); return; }
    info('<h3>Test version</h3><p class="bl">This web test version cannot take money. Unlock <b>' + esc(nm) + '</b> for free so you can try it?</p><p class="note">In the app, this button opens the App Store or Google Play.</p>' +
      '<button class="btn pri" data-act="testbuy" data-v="' + id + '">Unlock for testing</button>', true);
  }
  function bought(id) {
    toast('Thank you! ' + (ITEMS[id] ? ITEMS[id].name : 'Club') + ' is yours.');
    const it = ITEMS[id]; if (it && it.cat !== 'pack') { P.eq[it.cat] = it.key; delete trial[it.cat]; saveP(); }
    applyLook(); $('infoSheet').classList.add('hidden'); renderAll();
  }
  function restorePurchases() {
    if (window.PBStore) {
      toast('Checking your purchases…');
      window.PBStore.restore().then((ids) => { setOwned(ids, true); applyLook(); renderAll(); restored(); }).catch(() => toast('Could not reach the store. Check your internet and try again.'));
      return;
    }
    if (NATIVE || window.STORE_LIVE) { toast('Could not reach the store. Check your internet and try again.'); return; }
    restored();
  }
  function restored() {
    const ids = Object.keys(P.own || {}).map((k) => k === 'club' ? 'Club' : (ITEMS[k] ? ITEMS[k].name : k));
    info('<h3>Restore purchases</h3><p class="bl">' + (ids.length ? 'All set. You own: <b>' + esc(ids.join(', ')) + '</b>.' : 'No purchases were found' + (NATIVE ? ' for this store account.' : ' in this test version.')) + '</p>' +
      '<p class="note">Your purchases come back on any phone signed in to the same Apple ID or Google account. You never pay twice.</p>');
  }

  // ---------- applying what you picked ----------
  function applyLook() {
    const play = $('play'); play.className = play.className.replace(/\bbg-\S+/g, '').trim() + ' bg-' + equipped('bg'); if (play.classList.contains('hidden')) { /* keep hidden */ }
    Jig.soundPack = equipped('snd');
    const st = equipped('style'); if (Jig.pieceStyle !== st) Jig.setPieceStyle(st);
    if (window.MMusic) MMusic.setPack(equipped('music'));
    syncMusicBtn();
  }
  function syncMusicBtn() { const b = $('musicBtn'); if (b) b.classList.toggle('on', !!(window.MMusic && MMusic.on)); }
  function musicOn() { if (!window.MMusic) return; if (!MMusic.on) { MMusic.setPack(equipped('music')); MMusic.start(); } syncMusicBtn(); }
  function musicOff() { if (window.MMusic && MMusic.on) MMusic.stop(); syncMusicBtn(); }
  function clearTrial() { const had = Object.keys(trial).length; Object.keys(trial).forEach((k) => delete trial[k]); if (had) { applyLook(); } if (previewMusic) { previewMusic = false; if (!P.music) musicOff(); } }
  let previewMusic = false;

  // ---------- shop screen ----------
  const stylePic = () => (PICS.find((p) => /Candy shop/.test(p.title)) || PICS[0]).thumb;
  function pieceSvg(style, pic) {
    const d = 'M12 28 H34 C34 18 54 18 54 28 H76 V50 C86 50 86 70 76 70 V92 H12 V70 C22 70 22 50 12 50 Z';
    const id = 'pt' + style;
    let defs = '<defs><pattern id="' + id + '" patternUnits="userSpaceOnUse" width="100" height="100"><image href="' + pic + '" x="-6" y="-6" width="112" height="112" preserveAspectRatio="xMidYMid slice"/></pattern>' +
      '<linearGradient id="g' + id + '" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".55"/><stop offset=".5" stop-color="#fff" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>' +
      '<filter id="f' + id + '" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="1" dy="' + (style === 'soft' ? 4 : 3) + '" stdDeviation="' + (style === 'soft' ? 4 : 2.2) + '" flood-opacity=".5"/></filter></defs>';
    let strokeC = 'rgba(0,0,0,.35)', sw = 1;
    if (style === 'wooden') { strokeC = '#60381a'; sw = 3; } else if (style === 'stained') { strokeC = '#10101a'; sw = 4.5; } else if (style === 'soft') { strokeC = 'rgba(0,0,0,.2)'; sw = 1; }
    let body = '<path d="' + d + '" fill="url(#' + id + ')" stroke="' + strokeC + '" stroke-width="' + sw + '" filter="url(#f' + id + ')"/>';
    if (style === 'glossy') body += '<path d="' + d + '" fill="url(#g' + id + ')"/>';
    if (style === 'wooden') body += '<path d="' + d + '" fill="rgba(170,110,50,.12)"/>';
    if (style === 'classic' || style === 'glossy') body += '<path d="' + d + '" fill="none" stroke="rgba(255,255,255,.5)" stroke-width="1.6" transform="translate(1,1)"/>';
    return '<svg viewBox="0 0 100 110">' + defs + body + '</svg>';
  }
  function previewOf(it, big) {
    if (it.cat === 'pack') {
      const ps = PICS.filter((p) => p.pack === it.key);
      return '<div class="strip">' + ps.slice(0, 3).map((p) => '<img src="' + p.thumb + '" alt="">').join('') + '</div>';
    }
    if (it.cat === 'bg') return '<div class="bgprev bg-' + it.key + '" style="width:100%;height:100%"></div>';
    if (it.cat === 'style') return pieceSvg(it.key, stylePic());
    if (it.cat === 'snd') return '🔔';
    return '🎵';
  }
  function card(id) {
    const it = ITEMS[id], owned = owns(id), inUse = it.cat !== 'pack' && equipped(it.cat) === it.key;
    const b = document.createElement('button'); b.className = 'scard';
    const free = isFree(id);
    b.innerHTML = '<div class="sprev">' + previewOf(it) + '</div><div class="nm">' + esc(it.name) + '</div>' +
      '<div class="pr' + (owned ? ' owned' : '') + '">' + (free ? 'Free' : owned ? (hasClub() && !(P.own[id]) ? 'In the Club' : 'Owned ✓') : priceOf(id)) + '</div>' +

  }
  function renderShop() {
    const box = $('paneS'); box.innerHTML = '';
    const club = document.createElement('div'); club.className = 'club';
    club.innerHTML = hasClub()

      : '<h3>Pieceberry Club</h3><p>Everything unlocked: every picture pack, table background, piece style, click sound and song. New packs we add later too. Still no ads, ever.</p>' +
        '<div class="plans"><button class="plan" data-v="club_monthly">' + esc(priceOf('club_monthly')) + '<small>per month</small></button><button class="plan best" data-v="club_yearly">' + esc(priceOf('club_yearly')) + '<small>per year · best value</small></button></div>' +
        '<p style="margin:10px 0 0;font-size:12.5px;font-weight:700">Renews until you cancel it in your store account. Cancel any time.</p>';
    club.querySelectorAll('.plan').forEach((b) => { b.onclick = () => buy(b.dataset.v); });
    box.appendChild(club);
    Object.keys(CATS).forEach((cat) => {
      const ids = Object.keys(ITEMS).filter((k) => ITEMS[k].cat === cat); if (!ids.length) return;

  }

  function openItem(id) {
    const it = ITEMS[id], owned = owns(id), cat = it.cat;
    let pv;
    if (cat === 'pack') pv = '<div class="pgrid">' + PICS.filter((p) => p.pack === it.key).slice(0, 6).map((p) => '<img src="' + p.thumb + '" alt="">').join('') + '</div>';
    else if (cat === 'bg') pv = '<div class="bgprev bg-' + it.key + '"></div>';
    else if (cat === 'style') pv = pieceSvg(it.key, stylePic());
    else if (cat === 'snd') pv = '<button class="btn sec" style="margin:20px;width:auto;padding:12px 22px" data-act="play">▶ Hear it</button>';
    else pv = '<button class="btn sec" style="margin:20px;width:auto;padding:12px 22px" data-act="listen">▶ Listen</button>';
    const n = cat === 'pack' ? PICS.filter((p) => p.pack === it.key).length : 0;
    let acts = '';
    if (owned) {
      if (cat === 'pack') acts = '<button class="btn pri" data-act="seepack">See the pictures</button>';
      else acts = equipped(cat) === it.key && !trial[cat] ? '<button class="btn sec" disabled style="opacity:.7">✓ In use</button>' : '<button class="btn pri" data-act="use">Use it</button>';
    } else {
      if (cat === 'bg' || cat === 'style' || cat === 'snd') acts += '<button class="btn sec" data-act="try">Try it</button>';
      acts += '<button class="btn pri" data-act="buy">Buy · ' + esc(priceOf(id)) + '</button>';
      acts += '<button class="btn sec" data-act="club">Get everything with the Club</button>';
    }
    info('<div class="isheet"><div class="pv">' + pv + '</div><h3>' + esc(it.name) + '</h3><div class="bl">' + esc(it.blurb || '') + (n ? ' ' + n + ' pictures to start, and more are added over time.' : '') + '</div>' + acts + '</div>', true);
    $('infoBody').querySelectorAll('[data-act]').forEach((b) => b.onclick = () => {
      const a = b.dataset.act;
      if (a === 'buy') buy(id);
      else if (a === 'club') { $('infoSheet').classList.add('hidden'); setTab('shop'); $('home').scrollTop = 0; }
      else if (a === 'use') { P.eq[cat] = it.key; delete trial[cat]; saveP(); applyLook(); renderAll(); toast(it.name + ' is on.'); $('infoSheet').classList.add('hidden'); }
      else if (a === 'try') { trial[cat] = it.key; applyLook(); $('infoSheet').classList.add('hidden'); toast('Trying ' + it.name + '. Open a puzzle to see it. It goes back when you leave.'); if (cat === 'snd') Jig.preview('sound'); }
      else if (a === 'play') { trial.snd = it.key; Jig.soundPack = it.key; Jig.sound = true; Jig.preview('sound'); }
      else if (a === 'listen') { previewMusic = true; trial.music = it.key; MMusic.setPack(it.key); if (!MMusic.on) MMusic.start(); syncMusicBtn(); b.textContent = '♪ Playing…'; }
      else if (a === 'seepack') { $('infoSheet').classList.add('hidden'); filter = it.key; setTab('pics'); renderPicsChips(); renderGrid(); $('home').scrollTop = 0; }
      else if (a === 'testbuy') { }
    });
  }

  function cleanTitle(t) { return t.replace(/\s*—\s*\d{4}$/, '').replace(/, from the series.*$/i, '').replace(/\s*\(.*$/, ''); }

  function renderDaily() {
    const t = today(), i = dailyIndex(t), p = PICS[i], sv = Jig.loadSave(DKEY(t)), st = streakInfo();
    let status, go;
    if (st.doneToday) { status = 'Done for today. A new picture comes tomorrow.'; go = '✓ Look at it'; }
    else if (sv) { status = 'You have placed ' + sv.placed.length + ' of ' + sv.cols * sv.rows + ' pieces.'; go = '▶ Continue'; }
    else { status = DAILY_N + ' pieces, about 10 minutes.'; go = '▶ Start'; }
    const letters = ['S', 'M', 'T', 'W', 'T', 'F', 'S'], days = st.days || [];
    let week = '';
    for (let k = 6; k >= 0; k--) {
      const d = addDays(t, -k), wd = new Date(d + 'T12:00:00').getDay();
      week += '<span class="' + (days.indexOf(d) >= 0 ? 'on' : '') + (k === 0 ? ' now' : '') + '" title="' + d + '">' + letters[wd] + '</span>';
    }
    const streak = st.current > 0 ? '🔥 ' + st.current + '-day streak' + (st.best > st.current ? ' · best ' + st.best : '')
      : (st.best > 0 ? 'Start a new streak today · best ' + st.best : 'Finish it to start a streak');
    const box = $('daily'); box.innerHTML = '';
    const b = document.createElement('button'); b.className = 'daily' + (st.doneToday ? ' done' : '');
    b.innerHTML = '<div class="dimg"><img src="' + (p.thumb || p.file) + '" alt="">' + (st.doneToday ? '<div class="tick">✅</div>' : '') + '</div>' +
      '<div class="dl"><div class="kick">Today\'s puzzle</div><div class="dt">' + esc(niceDate(t)) + '</div>' +
      '<div class="st">' + esc(status) + '</div><div class="streak">' + esc(streak) + '</div><div class="week">' + week + '</div>' +
      '<div class="go">' + go + '</div></div>';
    b.onclick = () => {
      if (st.doneToday) { const list = collectionList(), at = list.findIndex((e) => e.i === i); openViewer(list, Math.max(0, at)); }
      else begin(i, DAILY_N, sv, t);
    };
    box.appendChild(b);
  }

  function renderWall() {
    const list = collectionList(), wall = $('wall');
    const pct = Math.round(list.length / PICS.length * 100);
    $('collHead').innerHTML = '<b>' + list.length + ' of ' + PICS.length + '</b>pictures finished<div class="bar2"><i style="width:' + pct + '%"></i></div>';
    $('tabColl').textContent = 'Collection' + (list.length ? ' (' + list.length + ')' : '');
    wall.innerHTML = '';
    if (!list.length) { wall.innerHTML = '<div class="empty"><span class="big">🖼️</span>Your finished puzzles hang here.<br>Finish one and it goes up on the wall.</div>'; return; }
    list.forEach((e, n) => {
      const p = PICS[e.i], f = document.createElement('button');
      f.className = 'frame' + (e.daily ? ' gold' : ''); f.style.setProperty('--tilt', ((n * 37) % 5 - 2) * 0.6 + 'deg');
      f.innerHTML = '<span class="pin"></span><img loading="lazy" src="' + (p.thumb || p.file) + '" alt=""><div class="cap">' + esc(cleanTitle(p.title)) + '</div>' + (e.times > 1 ? '<span class="times">×' + e.times + '</span>' : '');
      f.onclick = () => openViewer(list, n);
      wall.appendChild(f);
    });
  }

  function setTab(t) {
    homeTab = t;
    $('tabPics').classList.toggle('on', t === 'pics'); $('tabColl').classList.toggle('on', t === 'coll'); $('tabShop').classList.toggle('on', t === 'shop');
    $('paneP').classList.toggle('hidden', t !== 'pics'); $('paneC').classList.toggle('hidden', t !== 'coll'); $('paneS').classList.toggle('hidden', t !== 'shop');
  }
  $('tabPics').onclick = () => setTab('pics');
  $('tabColl').onclick = () => setTab('coll');
  $('tabShop').onclick = () => setTab('shop');

  // full-screen viewer for finished pictures
  let vList = [], vAt = 0;
  function openViewer(list, at) {
    if (!list.length) return;
    vList = list; vAt = at; showViewer(); $('viewer').classList.remove('hidden');
  }
  function showViewer() {
    const e = vList[vAt], p = PICS[e.i];
    $('vImg').src = p.file; $('vTitle').textContent = cleanTitle(p.title);
    $('vMeta').textContent = p.artist + ' · finished ' + shortDate(e.last) + ' · ' + e.pieces + ' pieces' + (e.times > 1 ? ' · done ' + e.times + ' times' : '') + (e.daily ? ' · ★ daily' : '');
    $('vPrev').style.visibility = vList.length > 1 ? '' : 'hidden'; $('vNext').style.visibility = vList.length > 1 ? '' : 'hidden';
  }
  $('vClose').onclick = () => $('viewer').classList.add('hidden');
  $('vPrev').onclick = () => { vAt = (vAt - 1 + vList.length) % vList.length; showViewer(); };
  $('vNext').onclick = () => { vAt = (vAt + 1) % vList.length; showViewer(); };
  $('vPlay').onclick = () => { $('viewer').classList.add('hidden'); openSheet(vList[vAt].i); };
  // swipe left/right on the picture
  let vsx = null;
  $('viewer').addEventListener('pointerdown', (e) => { vsx = e.clientX; });
  $('viewer').addEventListener('pointerup', (e) => { if (vsx === null) return; const dx = e.clientX - vsx; vsx = null; if (Math.abs(dx) > 50 && vList.length > 1) (dx < 0 ? $('vNext') : $('vPrev')).click(); });
  addEventListener('keydown', (e) => {
    if ($('viewer').classList.contains('hidden')) return;
    if (e.key === 'ArrowRight') $('vNext').click(); else if (e.key === 'ArrowLeft') $('vPrev').click(); else if (e.key === 'Escape') $('vClose').click();
  });

  let filter = 'all';
  function renderPicsChips() {
    const box = $('chips'); box.innerHTML = '';
    [['all', 'All']].concat(PACKS.map((p) => [p[0], p[1]])).forEach(([k, nm]) => {
      const locked = k !== 'all' && !owns('pack_' + k);
      const b = document.createElement('button'); b.className = 'chipb' + (filter === k ? ' on' : ''); b.textContent = (locked ? '🔒 ' : '') + nm;
      b.onclick = () => { filter = k; renderPicsChips(); renderGrid(); }; box.appendChild(b);
    });
  }
  function renderGrid() {
    const g = $('grid'); g.innerHTML = '';
    PICS.forEach((p, i) => {
      if (filter !== 'all' && p.pack !== filter) return;
      const s = Jig.loadSave(key(i)), locked = !hasPic(i), b = document.createElement('button'); b.className = 'pic' + (locked ? ' locked' : '');
      let badge = '';
      if (locked) badge = '<span class="badge lock">🔒 ' + esc(priceOf('pack_' + p.pack)) + '</span>';
      else if (s) {
        const tot = s.cols * s.rows, pl = s.placed.length;
        if (s.done) badge = '<span class="badge done">★ Done</span>'; else badge = '<span class="badge">' + Math.round(pl / tot * 100) + '%</span>';
      }
      b.innerHTML = '<img loading="lazy" src="' + (p.thumb || p.file) + '" alt="">' + badge + '<div class="t"><b>' + esc(cleanTitle(p.title)) + '</b><small>' + esc(p.artist) + '</small></div>';
      b.onclick = () => openSheet(i);
      g.appendChild(b);
    });
  }
  function renderAll() { renderDaily(); renderWall(); renderPicsChips(); renderGrid(); renderShop(); const c = $('cont'); c.innerHTML = ''; let resume = null;
    PICS.forEach((p, i) => { const s = Jig.loadSave(key(i)); if (s && !s.done && hasPic(i) && resume === null) resume = i; });
    if (resume !== null) { const p = PICS[resume], b = document.createElement('button'); b.className = 'btn pri'; b.style.marginTop = '0'; b.textContent = '▶  Continue: ' + cleanTitle(p.title); b.onclick = () => openSheet(resume); c.appendChild(b); } }
  function renderHome() { renderAll(); setTab(homeTab); }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  function openSheet(i) {
    if (!hasPic(i)) return openItem('pack_' + PICS[i].pack);
    const p = PICS[i], s = Jig.loadSave(key(i));
    $('sPrev').src = p.file; $('sTitle').textContent = cleanTitle(p.title); $('sBy').textContent = p.date ? p.artist + ' · ' + p.date : p.artist;
    const r = $('sResume'); r.innerHTML = '';
    if (s && !s.done) {
      const b = document.createElement('button'); b.className = 'btn pri'; b.style.marginTop = '0';
      b.textContent = 'Continue (' + s.placed.length + ' of ' + s.cols * s.rows + ' pieces)'; b.onclick = () => begin(i, 0, s); r.appendChild(b);
      $('sLbl').textContent = 'Or start over with';
    } else $('sLbl').textContent = s && s.done ? 'Play again with' : 'Choose pieces';
    const box = $('sizes'); box.innerHTML = '';
    const pi = new Image(); pi.src = p.file;
    const fill = () => {
      box.innerHTML = '';
      const asp = pi.naturalWidth && pi.naturalHeight ? pi.naturalWidth / pi.naturalHeight : 1.33;
      sizesNow().forEach((n) => {
        const g = Jig.gridFor(n, asp), b = document.createElement('button'); b.className = 'size';
        b.innerHTML = (g.cols * g.rows) + '<small>pieces</small>'; b.onclick = () => begin(i, n, null); box.appendChild(b);
      });
    };
    if (pi.complete) fill(); else { pi.onload = fill; fill(); }
    $('sizeSheet').classList.remove('hidden');
  }
  $('sCancel').onclick = () => $('sizeSheet').classList.add('hidden');
  $('sizeSheet').onclick = (e) => { if (e.target.id === 'sizeSheet') $('sizeSheet').classList.add('hidden'); };

  // daily = the date string when this is the Daily Puzzle (own save, fixed cut), otherwise null
  function begin(i, n, saved, daily) {
    $('sizeSheet').classList.add('hidden');
    const k = daily ? DKEY(daily) : key(i);
    if (!saved) Jig.clearSave(k);
    cur = i; curDaily = daily || null; const p = PICS[i];
    $('ptitle').textContent = daily ? 'Today\'s puzzle' : cleanTitle(p.title);
    $('partist').textContent = daily ? cleanTitle(p.title) + ' · ' + p.artist : p.artist;
    img = new Image();
    img.onload = () => {
      $('home').classList.add('hidden'); $('play').classList.remove('hidden');
      applyLook(); if (P.music) musicOn();
      requestAnimationFrame(() => Jig.start($('cv'), img, k, n, saved, daily ? dailySeed(daily) : null));
    };
    img.src = p.file;
    syncTools();
  }

  Jig.onChange = (pr) => { if (pr) $('count').textContent = pr.placed + '/' + pr.total; };
  Jig.onWin = () => {
    const p = PICS[cur], pr = Jig.progress();
    addToCollection(cur, pr ? pr.total : 0, !!curDaily);
    $('wImg').src = p.file;
    if (curDaily) {
      const s = markDailyDone(curDaily), counted = s.last === curDaily;
      $('wTitle').textContent = 'Today\'s puzzle is done!';
      $('wText').textContent = counted ? (s.count > 1 ? '🔥 ' + s.count + ' days in a row. See you tomorrow!' : '🔥 Your streak has started. See you tomorrow!') : 'It is now in your collection.';
      $('wHome').textContent = 'Home'; $('wNext').textContent = 'My collection';
    } else {
      $('wTitle').textContent = 'Beautiful!';
      $('wText').textContent = cleanTitle(p.title) + ' is now on your collection wall.';
      $('wHome').textContent = 'All pictures'; $('wNext').textContent = 'Next picture';
    }
    confetti(); setTimeout(() => $('winBox').classList.remove('hidden'), 700);
  };
  function goHome() { Jig.stop(); musicOff(); clearTrial(); $('play').classList.add('hidden'); $('home').classList.remove('hidden'); $('winBox').classList.add('hidden'); $('home').scrollTop = 0; renderHome(); }
  $('back').onclick = goHome;
  $('wHome').onclick = () => { if (!curDaily) homeTab = 'pics'; goHome(); };
  $('wNext').onclick = () => {
    if (curDaily) { homeTab = 'coll'; goHome(); return; }
    let next = (cur + 1) % PICS.length, guard = 0; while (!hasPic(next) && guard++ < PICS.length) next = (next + 1) % PICS.length; homeTab = 'pics'; goHome(); openSheet(next);
  };

  $('musicBtn').onclick = () => { if (window.MMusic && MMusic.on) { P.music = false; setPref('music', false); musicOff(); } else { P.music = true; setPref('music', true); musicOn(); } };
  $('zIn').onclick = () => Jig.zoomBy(1.6);
  $('zOut').onclick = () => Jig.zoomBy(1 / 1.6);
  $('zFit').onclick = () => Jig.zoomFit();

  // tools
  function syncTools() {
    $('tEdges').classList.toggle('on', Jig.edgesOnly); $('tGhost').classList.toggle('on', Jig.ghost); $('tSound').classList.toggle('on', Jig.sound);
    $('tSound').querySelector('.i').textContent = Jig.sound ? '🔊' : '🔈';
  }
  $('tEdges').onclick = () => { Jig.edgesOnly = !Jig.edgesOnly; syncTools(); Jig.redraw(); };
  $('tGhost').onclick = () => { Jig.ghost = !Jig.ghost; setPref('ghost', Jig.ghost); syncTools(); Jig.redraw(); };
  $('tSound').onclick = () => { Jig.sound = !Jig.sound; setPref('sound', Jig.sound); syncTools(); };
  const peek = $('tPeek');
  peek.addEventListener('pointerdown', (e) => { e.preventDefault(); Jig.peek = true; peek.classList.add('on'); Jig.redraw(); });
  ['pointerup', 'pointerleave', 'pointercancel'].forEach((ev) => peek.addEventListener(ev, () => { Jig.peek = false; peek.classList.remove('on'); Jig.redraw(); }));
  peek.addEventListener('contextmenu', (e) => e.preventDefault());

  // settings + credits
  function info(html) {
    $('infoBody').innerHTML = html; $('infoSheet').classList.remove('hidden');
    $('infoBody').querySelectorAll('[data-act="testbuy"]').forEach((b) => b.onclick = () => { const id = b.dataset.v; if (CLUB[id]) P.own.club = 1; else P.own[id] = 1; saveP(); bought(id); });
  }
  $('infoClose').onclick = () => $('infoSheet').classList.add('hidden');
  $('infoSheet').onclick = (e) => { if (e.target.id === 'infoSheet') $('infoSheet').classList.add('hidden'); };
  $('credBtn').onclick = () => info('<h3>Credits</h3><div class="credits"><div><b>About the pictures</b><br>Every picture was created with AI image tools run on a private computer, with no outside service: Z-Image-Turbo (Apache-2.0 licence), enlarged with Real-ESRGAN (BSD-3 licence). They are not photographs of real places or people.</div>' +
    '<div><b>Music and sounds</b><br>Piano: Gymnopédies 1 and 3 (Erik Satie, played by Teknopazzo, CC0), Gnossienne 2 and 3 (Erik Satie, La Pianista, public domain), Clair de Lune (Claude Debussy, 1905 recording, public domain). Ocean waves: Jarrod Stanley (CC0). Rain: cori (public domain). Fireplace: ezwa (public domain). All via Wikimedia Commons. The other music and the click sounds are made live inside the app.</div>' +
    '<div><b>Pictures</b></div>' + PICS.map((p) => '<div><b>' + esc(cleanTitle(p.title)) + '</b><br>' + esc(p.artist) + (p.date ? ', ' + esc(p.date) : '') + '<br>' + esc(p.source) + (p.url ? ' · <a href="' + p.url + '" target="_blank" rel="noopener">source</a>' : '') + '</div>').join('') + '</div>');
  $('gear').onclick = () => {
    info('<h3>Settings</h3><div class="set">Big pieces in the tray<button class="sw' + (Jig.big ? ' on' : '') + '" data-k="big"></button></div>' +
      '<div class="set">Sound<button class="sw' + (Jig.sound ? ' on' : '') + '" data-k="sound"></button></div>' +
      '<div class="set">Faint picture on the board<button class="sw' + (Jig.ghost ? ' on' : '') + '" data-k="ghost"></button></div>' +
      '<button class="btn sec" id="restoreBtn" style="margin-top:12px">Restore purchases</button>' +
      '<p class="sub" style="margin-top:14px"><a href="' + LEGAL + '/privacy.html" target="_blank" rel="noopener">Privacy Policy</a> &middot; <a href="' + LEGAL + '/support.html" target="_blank" rel="noopener">Support</a></p>' +
      '<p class="sub" style="margin-top:12px">Pieceberry has no ads, no accounts and collects no data. Your puzzles are saved on this device.</p>');
    $('restoreBtn').onclick = () => { $('infoSheet').classList.add('hidden'); restorePurchases(); };
    document.querySelectorAll('.sw').forEach((b) => b.onclick = () => { const k = b.dataset.k; Jig[k] = !Jig[k]; setPref(k, Jig[k]); b.classList.toggle('on', Jig[k]); syncTools(); });
  };

  // confetti
  function confetti() {
    const c = $('confetti'), x = c.getContext('2d'); c.classList.remove('hidden');
    const W = c.width = innerWidth, H = c.height = innerHeight, cols = ['#b177c2', '#f2b632', '#ff8fa3', '#6fc08a', '#7ab8ff', '#fff'];
    const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.5, vx: Math.random() * 2 - 1, vy: 2 + Math.random() * 3, r: Math.random() * 6.28, vr: Math.random() * 0.2 - 0.1, s: 6 + Math.random() * 6, c: cols[(Math.random() * cols.length) | 0] }));
    let t = 0;
    (function f() {
      x.clearRect(0, 0, W, H); ps.forEach((p) => { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
      if (++t < 220) requestAnimationFrame(f); else c.classList.add('hidden');
    })();
  }

  applyLook(); storeSync(); renderHome();
})();
</script>
</body>
</html>
